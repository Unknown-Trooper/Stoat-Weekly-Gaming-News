name: Weekly gaming report to Stoat

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Build weekly report
        env:
          STOAT_WEBHOOK: ${{ secrets.STOAT_WEBHOOK_WEEKLY }}
          RAWG_KEY: ${{ secrets.RAWG_KEY }}
        run: |
          python3 - <<'PY'
          import html, json, os, re, sys, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta

          hook = os.environ.get("STOAT_WEBHOOK", "").strip()
          rawg_key = os.environ.get("RAWG_KEY", "").strip()
          if not hook.startswith("http"):
              print("missing STOAT_WEBHOOK_WEEKLY")
              sys.exit(1)

          UA = {"User-Agent": "Mozilla/5.0 StoatWeeklyReport/1.1"}
          now = datetime.now(timezone.utc)
          week = now.strftime("%b %d, %Y")
          start = now.date()
          end_this = (now + timedelta(days=7)).date()
          end_next = (now + timedelta(days=14)).date()

          def get_json(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=25) as resp:
                  return json.load(resp)

          def is_english(title):
              letters = re.findall(r"[A-Za-zА-Яа-яЁё]", title)
              if not letters:
                  return True
              cyr = sum(1 for ch in letters if "А" <= ch <= "я" or ch in "Ёё")
              return cyr / len(letters) < 0.3

          def app_name(appid):
              try:
                  data = get_json(f"https://store.steampowered.com/api/appdetails?appids={appid}&l=english")
                  info = data.get(str(appid), {})
                  if info.get("success"):
                      return info["data"].get("name") or str(appid)
              except Exception as err:
                  print("name fail", appid, err)
              return str(appid)

          hot_ids = []
          try:
              charts = get_json("https://api.steampowered.com/ISteamChartsService/GetMostPlayedGames/v1/")
              for row in charts.get("response", {}).get("ranks", [])[:10]:
                  appid = row.get("appid")
                  if appid:
                      hot_ids.append(int(appid))
              print("charts", len(hot_ids))
          except Exception as err:
              print("charts failed", err)
              hot_ids = [730, 553850, 3932890, 892970, 221100, 1808500, 1867240]

          hot = [(appid, app_name(appid)) for appid in hot_ids[:8]]
          print("named", [n for _, n in hot])

          updates = []
          cutoff = now - timedelta(days=7)
          skip_labels = {"steam community", "workshop"}
          for appid, name in hot:
              try:
                  data = get_json(
                      "https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/"
                      f"?appid={appid}&count=8&maxlength=140&format=json&l=english"
                  )
              except Exception as err:
                  print("news fail", appid, err)
                  continue
              for item in data.get("appnews", {}).get("newsitems", []):
                  title = html.unescape(item.get("title") or "")
                  label = (item.get("feedlabel") or "").lower()
                  if not title or not is_english(title) or label in skip_labels:
                      continue
                  date = datetime.fromtimestamp(int(item.get("date") or 0), tz=timezone.utc)
                  if date < cutoff:
                      continue
                  updates.append((name, title, appid))
                  break
          print("updates", len(updates))

          def rawg_games(start_d, end_d):
              if not rawg_key:
                  return []
              q = urllib.parse.urlencode({
                  "key": rawg_key,
                  "dates": f"{start_d},{end_d}",
                  "ordering": "-added",
                  "page_size": 6,
              })
              data = get_json("https://api.rawg.io/api/games?" + q)
              return [
                  (g.get("name"), g.get("released") or "")
                  for g in data.get("results", [])
                  if g.get("name")
              ]

          dropping, upcoming = [], []
          try:
              dropping = rawg_games(start, end_this)
              upcoming = rawg_games(end_this, end_next)
              print("rawg", len(dropping), len(upcoming))
          except Exception as err:
              print("rawg failed", err)

          chatter = []
          reddit_urls = [
              "https://old.reddit.com/r/Games/hot.json?limit=25",
              "https://www.reddit.com/r/Games/hot.json?limit=25",
              "https://old.reddit.com/r/pcgaming/hot.json?limit=25",
          ]
          for url in reddit_urls:
              try:
                  reddit = get_json(url)
                  for child in reddit.get("data", {}).get("children", []):
                      post = child.get("data") or {}
                      if post.get("stickied") or post.get("over_18"):
                          continue
                      title = html.unescape(post.get("title") or "")
                      if not title or not is_english(title):
                          continue
                      link = "https://www.reddit.com" + (post.get("permalink") or "")
                      chatter.append((title, link))
                      if len(chatter) >= 5:
                          break
                  print("chatter", url, len(chatter))
                  if chatter:
                      break
              except Exception as err:
                  print("reddit fail", url, err)

          def bullets(rows):
              return "\n".join(rows) if rows else "_Nothing this week._"

          parts = [
              f"# Weekly gaming report",
              f"_{week}_",
              "",
              "## Hot on Steam",
              bullets([f"**{name}** — <https://store.steampowered.com/app/{appid}>" for appid, name in hot]),
              "",
              "## Official updates",
              bullets([
                  f"**{name}** — {title}\n<https://store.steampowered.com/news/app/{appid}>"
                  for name, title, appid in updates[:7]
              ]),
              "",
              "## Dropping this week",
              bullets([f"**{name}** — {day}" for name, day in dropping[:6]]) if dropping else "_RAWG missed this week._",
              "",
              "## Next week",
              bullets([f"**{name}** — {day}" for name, day in upcoming[:6]]) if upcoming else "_RAWG missed this week._",
              "",
              "## Community chatter",
              "_r/Games. Not verified reporting._",
              bullets([f"{title}\n<{link}>" for title, link in chatter[:5]]),
              "",
              "_Sources: Steam charts, Steam news, RAWG._",
          ]
          text = "\n".join(parts).strip()
          chunks = []
          while text:
              chunks.append(text[:1900])
              text = text[1900:]

          for chunk in chunks:
              body = json.dumps({
                  "content": chunk,
                  "masquerade": {
                      "name": "Weekly Gaming Report",
                      "avatar": "https://pbs.twimg.com/profile_images/1702008325112741888/G6YzrWya.jpg"
                  }
              }).encode()
              req = urllib.request.Request(
                  hook, data=body,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("stoat", resp.status)
          print("done")
          PY
