name: Weekly gaming report to Stoat

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Build weekly report
        env:
          STOAT_WEBHOOK: ${{ secrets.STOAT_WEBHOOK_WEEKLY }}
          RAWG_KEY: ${{ secrets.RAWG_KEY }}
        run: |
          python3 - <<'PY'
          import html, json, os, re, sys, time, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta

          hook = os.environ.get("STOAT_WEBHOOK", "").strip()
          rawg_key = os.environ.get("RAWG_KEY", "").strip()
          if not hook.startswith("http"):
              print("missing STOAT_WEBHOOK_WEEKLY")
              sys.exit(1)

          UA = {"User-Agent": "StoatWeeklyReport/1.2"}
          now = datetime.now(timezone.utc)
          week = now.strftime("%b %d, %Y")
          start = now.date()
          end_this = (now + timedelta(days=7)).date()
          end_next = (now + timedelta(days=14)).date()

          KNOWN = {
              730: "Counter-Strike 2",
              570: "Dota 2",
              440: "Team Fortress 2",
              578080: "PUBG: BATTLEGROUNDS",
              431960: "Wallpaper Engine",
              1867240: "WARDOGS",
              1172470: "Apex Legends",
              892970: "Valheim",
              271590: "Grand Theft Auto V",
              553850: "Helldivers 2",
              3932890: "Escape from Tarkov",
              221100: "DayZ",
              1808500: "ARC Raiders",
              108600: "Project Zomboid",
              2168680: "Nuclear Option",
              976730: "Halo: The Master Chief Collection",
              2887580: "Active Matter",
              252490: "Rust",
              359550: "Rainbow Six Siege",
              1245620: "Elden Ring",
              1938090: "Call of Duty",
              236390: "War Thunder",
              394360: "Hearts of Iron IV",
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=25) as resp:
                  return json.load(resp)

          def is_english(title):
              letters = re.findall(r"[A-Za-zА-Яа-яЁё]", title)
              if not letters:
                  return True
              cyr = sum(1 for ch in letters if "А" <= ch <= "я" or ch in "Ёё")
              return cyr / len(letters) < 0.3

          def app_name(appid):
              if appid in KNOWN:
                  return KNOWN[appid]
              try:
                  spy = get_json(f"https://steamspy.com/api.php?request=appdetails&appid={appid}")
                  name = spy.get("name")
                  if name:
                      return name
              except Exception as err:
                  print("spy fail", appid, err)
              return f"App {appid}"

          hot_ids = []
          try:
              charts = get_json("https://api.steampowered.com/ISteamChartsService/GetMostPlayedGames/v1/")
              for row in charts.get("response", {}).get("ranks", [])[:10]:
                  appid = row.get("appid")
                  if appid:
                      hot_ids.append(int(appid))
              print("charts", hot_ids)
          except Exception as err:
              print("charts failed", err)
              hot_ids = [730, 570, 553850, 892970, 1867240]

          hot = []
          for appid in hot_ids[:8]:
              name = app_name(appid)
              hot.append((appid, name))
              print("named", appid, name)
              time.sleep(0.2)

          updates = []
          cutoff = now - timedelta(days=7)
          skip_re = re.compile(r"^(i |my |we made |check out my )", re.I)
          for appid, name in hot:
              try:
                  data = get_json(
                      "https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/"
                      f"?appid={appid}&count=10&maxlength=140&format=json&l=english"
                  )
              except Exception as err:
                  print("news fail", appid, err)
                  continue
              for item in data.get("appnews", {}).get("newsitems", []):
                  title = html.unescape(item.get("title") or "")
