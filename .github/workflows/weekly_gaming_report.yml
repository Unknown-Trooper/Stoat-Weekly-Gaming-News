name: Weekly gaming report to Stoat

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Build weekly report
        env:
          STOAT_WEBHOOK: ${{ secrets.STOAT_WEBHOOK_WEEKLY }}
          RAWG_KEY: ${{ secrets.RAWG_KEY }}
        run: |
          python3 - <<'PY'
          import html, json, os, re, sys, time, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta
          hook = os.environ.get("STOAT_WEBHOOK", "").strip()
          rawg_key = os.environ.get("RAWG_KEY", "").strip()
          if not hook.startswith("http"):
              print("missing STOAT_WEBHOOK_WEEKLY")
              sys.exit(1)

          # --- edit these ---
          WATCHLIST = [
              3932890,  # Escape from Tarkov
              1808500,  # ARC Raiders
              1867240,  # WARDOGS
              2168680,  # Nuclear Option
              553850,   # Helldivers 2
              108600,   # Project Zomboid
          ]
          BLACKLIST = {
              431960,   # Wallpaper Engine
          }
          # --- stop editing ---

          UA = {"User-Agent": "StoatWeeklyReport/1.5"}
          now = datetime.now(timezone.utc)
          week = now.strftime("%b %d, %Y")
          start = now.date()
          end_this = (now + timedelta(days=7)).date()
          end_next = (now + timedelta(days=14)).date()
          def get_json(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=25) as resp:
                  return json.load(resp)
          def is_english(title):
              letters = re.findall(r"[A-Za-zА-Яа-яЁё]", title)
              if not letters:
                  return True
              cyr = sum(1 for ch in letters if "А" <= ch <= "я" or ch in "Ёё")
              return cyr / len(letters) < 0.3
          def app_name(appid):
              if appid == 730:
                  return "Counter-Strike 2"
              if appid == 271590:
                  return "Grand Theft Auto V"
              try:
                  spy = get_json("https://steamspy.com/api.php?request=appdetails&appid=" + str(appid))
                  name = (spy.get("name") or "").strip()
                  if name:
                      if "Global Offensive" in name:
                          return "Counter-Strike 2"
                      return name
              except Exception as err:
                  print("spy fail", appid, err)
              return "App " + str(appid)
          hot_ids = []
          try:
              charts = get_json("https://api.steampowered.com/ISteamChartsService/GetMostPlayedGames/v1/")
              for row in charts.get("response", {}).get("ranks", [])[:12]:
                  appid = row.get("appid")
                  if appid:
                      hot_ids.append(int(appid))
              print("charts", hot_ids)
          except Exception as err:
              print("charts failed", err)
              hot_ids = [730, 570, 553850, 892970]
          ordered = []
          for appid in list(WATCHLIST) + hot_ids:
              if appid in BLACKLIST or appid in ordered:
                  continue
              ordered.append(appid)
          ordered = ordered[:10]
          print("final ids", ordered)
          hot = []
          for appid in ordered:
              name = app_name(appid)
              hot.append((appid, name))
              print("named", appid, name)
              time.sleep(0.2)
          updates = []
          cutoff = now - timedelta(days=7)
          skip_re = re.compile(r"(^i |^my |mod i |workshop|piggyback|check out my)", re.I)
          for appid, name in hot:
              try:
                  data = get_json(
                      "https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/"
                      "?appid=" + str(appid) + "&count=12&maxlength=140&format=json&l=english"
                  )
              except Exception as err:
                  print("news fail", appid, err)
                  continue
              for item in data.get("appnews", {}).get("newsitems", []):
                  title = html.unescape(item.get("title") or "")
                  label = (item.get("feedlabel") or "").lower()
                  if not title or not is_english(title) or skip_re.search(title):
                      continue
                  if "workshop" in label or "mod" in label or len(title) > 110:
                      continue
                  date = datetime.fromtimestamp(int(item.get("date") or 0), tz=timezone.utc)
                  if date < cutoff:
                      continue
                  updates.append((name, title, appid))
                  break
          def rawg_games(start_d, end_d):
              if not rawg_key:
                  return []
              q = urllib.parse.urlencode({
                  "key": rawg_key,
                  "dates": str(start_d) + "," + str(end_d),
                  "ordering": "-added",
                  "page_size": 6,
              })
              data = get_json("https://api.rawg.io/api/games?" + q)
              rows = []
              for g in data.get("results", []):
                  if g.get("name"):
                      rows.append((g.get("name"), g.get("released") or ""))
              return rows
          dropping, upcoming = [], []
          try:
              dropping = rawg_games(start, end_this)
              upcoming = rawg_games(end_this, end_next)
              print("rawg", len(dropping), len(upcoming))
          except Exception as err:
              print("rawg failed", err)
          chatter = []
          seen = set()
          def add_chat(title, link):
              title = html.unescape(title or "").strip()
              if not title or title.lower() in seen or not is_english(title):
                  return
              if len(title) < 20:
                  return
              seen.add(title.lower())
              chatter.append((title, link))
          for sub in ("Games", "pcgaming"):
              url = "https://api.pullpush.io/reddit/search/submission/?subreddit=" + sub + "&sort=desc&size=15"
              try:
                  data = get_json(url)
                  rows = data.get("data") if isinstance(data, dict) else data
                  print("pullpush", sub, len(rows) if rows else 0)
                  for post in rows or []:
                      link = post.get("permalink") or post.get("url") or ""
                      if link and link.startswith("/"):
                          link = "https://www.reddit.com" + link
                      add_chat(post.get("title") or "", link)
                      if len(chatter) >= 5:
                          break
              except Exception as err:
                  print("pullpush fail", sub, err)
              if len(chatter) >= 5:
                  break
          if not chatter:
              for comm in ("games", "pcgaming"):
                  url = "https://lemmy.world/api/v3/post/list?sort=Hot&limit=15&community_name=" + comm
                  try:
                      data = get_json(url)
                      print("lemmy", comm, "ok")
                      for row in data.get("posts", []):
                          post = row.get("post") or {}
                          add_chat(post.get("name") or "", post.get("ap_id") or "")
                          if len(chatter) >= 5:
                              break
                  except Exception as err:
                      print("lemmy fail", comm, err)
                  if len(chatter) >= 5:
                      break
          print("chatter", len(chatter))
          def bullets(rows):
              return "\n".join(rows) if rows else "_Nothing this week._"
          hot_lines = ["**" + name + "** — <https://store.steampowered.com/app/" + str(appid) + ">" for appid, name in hot]
          update_lines = ["**" + name + "** — " + title + "\n<https://store.steampowered.com/news/app/" + str(appid) + ">" for name, title, appid in updates[:8]]
          drop_lines = ["**" + name + "** — " + day for name, day in dropping[:6]]
          next_lines = ["**" + name + "** — " + day for name, day in upcoming[:6]]
          chat_lines = []
          for title, link in chatter[:5]:
              line = title
              if link:
                  line += "\n<" + link + ">"
              chat_lines.append(line)
          parts = [
              "# Weekly gaming report",
              "_" + week + "_",
              "",
              "## Watchlist + hot on Steam",
              bullets(hot_lines),
              "",
              "## Official updates",
              bullets(update_lines),
              "",
              "## Dropping this week",
              bullets(drop_lines),
              "",
              "## Next week",
              bullets(next_lines),
              "",
              "## Gamer convos",
              "_Community threads. Not verified reporting._",
              bullets(chat_lines),
              "",
              "_Sources: Steam charts, Steam news, RAWG._",
          ]
          text = "\n".join(parts).strip()
          print("report chars", len(text))
          chunks = []
          while text:
              if len(text) <= 1900:
                  chunks.append(text)
                  break
              cut = text.rfind("\n", 0, 1900)
              if cut < 200:
                  cut = 1900
              chunks.append(text[:cut])
              text = text[cut:].lstrip("\n")
          print("chunks", len(chunks))
          for chunk in chunks:
              body = json.dumps({
                  "content": chunk,
                  "masquerade": {
                      "name": "Weekly Gaming Report",
                      "avatar": "https://pbs.twimg.com/profile_images/1702008325112741888/G6YzrWya.jpg"
                  }
              }).encode()
              req = urllib.request.Request(
                  hook,
                  data=body,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("stoat", resp.status)
          print("done")
          PY
