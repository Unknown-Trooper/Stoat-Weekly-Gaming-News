name: Weekly gaming report to Stoat

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Build weekly report
        env:
          STOAT_WEBHOOK: ${{ secrets.STOAT_WEBHOOK_WEEKLY }}
          RAWG_KEY: ${{ secrets.RAWG_KEY }}
        run: |
          python3 - <<'PY'
          import html, json, os, re, sys, time, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta
          hook = os.environ.get("STOAT_WEBHOOK", "").strip()
          rawg_key = os.environ.get("RAWG_KEY", "").strip()
          if not hook.startswith("http"):
              print("missing STOAT_WEBHOOK_WEEKLY")
              sys.exit(1)
          UA = {"User-Agent": "StoatWeeklyReport/1.3"}
          now = datetime.now(timezone.utc)
          week = now.strftime("%b %d, %Y")
          start = now.date()
          end_this = (now + timedelta(days=7)).date()
          end_next = (now + timedelta(days=14)).date()
          def get_json(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=25) as resp:
                  return json.load(resp)
          def is_english(title):
              letters = re.findall(r"[A-Za-zА-Яа-яЁё]", title)
              if not letters:
                  return True
              cyr = sum(1 for ch in letters if "А" <= ch <= "я" or ch in "Ёё")
              return cyr / len(letters) < 0.3
          def app_name(appid):
              try:
                  spy = get_json("https://steamspy.com/api.php?request=appdetails&appid=" + str(appid))
                  name = (spy.get("name") or "").strip()
                  if name:
                      return name
              except Exception as err:
                  print("spy fail", appid, err)
              return "App " + str(appid)
          hot_ids = []
          try:
              charts = get_json("https://api.steampowered.com/ISteamChartsService/GetMostPlayedGames/v1/")
              for row in charts.get("response", {}).get("ranks", [])[:10]:
                  appid = row.get("appid")
                  if appid:
                      hot_ids.append(int(appid))
              print("charts", hot_ids)
          except Exception as err:
              print("charts failed", err)
              hot_ids = [730, 570, 553850, 892970]
          hot = []
          for appid in hot_ids[:8]:
              name = app_name(appid)
              hot.append((appid, name))
              print("named", appid, name)
              time.sleep(0.25)
          updates = []
          cutoff = now - timedelta(days=7)
          skip_re = re.compile(r"^(i |my |we made |check out my )", re.I)
          for appid, name in hot:
              try:
                  data = get_json(
                      "https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/"
                      "?appid=" + str(appid) + "&count=10&maxlength=140&format=json&l=english"
                  )
              except Exception as err:
                  print("news fail", appid, err)
                  continue
              for item in data.get("appnews", {}).get("newsitems", []):
                  title = html.unescape(item.get("title") or "")
                  label = (item.get("feedlabel") or "").lower()
                  if not title or not is_english(title) or skip_re.search(title):
                      continue
                  if "workshop" in label or label == "community":
                      continue
                  date = datetime.fromtimestamp(int(item.get("date") or 0), tz=timezone.utc)
                  if date < cutoff:
                      continue
                  updates.append((name, title, appid))
                  break
          def rawg_games(start_d, end_d):
              if not rawg_key:
                  return []
              q = urllib.parse.urlencode({
                  "key": rawg_key,
                  "dates": str(start_d) + "," + str(end_d),
                  "ordering": "-added",
                  "page_size": 6,
              })
              data = get_json("https://api.rawg.io/api/games?" + q)
              rows = []
              for g in data.get("results", []):
                  if g.get("name"):
                      rows.append((g.get("name"), g.get("released") or ""))
              return rows
          dropping, upcoming = [], []
          try:
              dropping = rawg_games(start, end_this)
              upcoming = rawg_games(end_this, end_next)
              print("rawg", len(dropping), len(upcoming))
          except Exception as err:
              print("rawg failed", err)
          chatter = []
          seen = set()
          after = int((now - timedelta(days=7)).timestamp())
          for sub in ("Games", "pcgaming"):
              url = (
                  "https://api.pullpush.io/reddit/search/submission/"
                  "?subreddit=" + sub + "&sort=desc&size=20&after=" + str(after)
              )
              try:
                  data = get_json(url)
                  print("pullpush", sub, "ok")
              except Exception as err:
                  print("pullpush fail", sub, err)
                  continue
              for post in data.get("data", []):
                  title = html.unescape(post.get("title") or "")
                  permalink = post.get("permalink") or ""
                  if not title or title.lower() in seen or not is_english(title):
                      continue
                  if post.get("over_18") or post.get("stickied"):
                      continue
                  if permalink and not permalink.startswith("http"):
                      permalink = "https://www.reddit.com" + permalink
                  seen.add(title.lower())
                  chatter.append((title, permalink, sub))
                  if len(chatter) >= 6:
                      break
              if len(chatter) >= 6:
                  break
          print("chatter", len(chatter))
          def bullets(rows):
              return "\n".join(rows) if rows else "_Nothing this week._"
          hot_lines = []
          for appid, name in hot:
              hot_lines.append("**" + name + "** — <https://store.steampowered.com/app/" + str(appid) + ">")
          update_lines = []
          for name, title, appid in updates[:7]:
              update_lines.append("**" + name + "** — " + title + "\n<https://store.steampowered.com/news/app/" + str(appid) + ">")
          drop_lines = ["**" + name + "** — " + day for name, day in dropping[:6]]
          next_lines = ["**" + name + "** — " + day for name, day in upcoming[:6]]
          chat_lines = []
          for title, link, sub in chatter[:5]:
              line = title
              if link:
                  line += "\n<" + link + ">"
              chat_lines.append(line)
          parts = [
              "# Weekly gaming report",
              "_" + week + "_",
              "",
              "## Hot on Steam",
              bullets(hot_lines),
              "",
              "## Official updates",
              bullets(update_lines),
              "",
              "## Dropping this week",
              bullets(drop_lines),
              "",
              "## Next week",
              bullets(next_lines),
              "",
              "## Gamer convos",
              "_r/Games and r/pcgaming. Not verified reporting._",
              bullets(chat_lines),
              "",
              "_Sources: Steam charts, Steam news, RAWG, Pullpush._",
          ]
          text = "\n".join(parts).strip()
          print("report chars", len(text))
          chunks = []
          while text:
              chunks.append(text[:1900])
              text = text[1900:]
          print("chunks", len(chunks))
          for chunk in chunks:
              body = json.dumps({
                  "content": chunk,
                  "masquerade": {
                      "name": "Weekly Gaming Report",
                      "avatar": "https://pbs.twimg.com/profile_images/1702008325112741888/G6YzrWya.jpg"
                  }
              }).encode()
              req = urllib.request.Request(
                  hook,
                  data=body,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("stoat", resp.status)
          print("done")
          PY
